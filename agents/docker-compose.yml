# Production stack: the Hono agent API. The OpenTUI client is a terminal app and
# runs on your machine against the published API port; it is not a container.
#
# JANGAN `cd agents && docker compose up` — path di file ini relatif ke
# root repo (tempat Coolify menjalankan `docker compose --project-directory
# <root> -f agents/docker-compose.yml`). Jadi build context = ./agents/api.
# Kalau tetap dari folder agents/, pakai: docker compose -f docker-compose.yml
# TIDAK akan resolve; jalankan dari root:
#
#   cp agents/api/.env.example agents/api/.env   # set OPENAI_API_KEY (dan EXA_API_KEY untuk tools=exa)
#   docker compose -f agents/docker-compose.yml up -d --build
#   curl localhost:3000/health
#
# Di Coolify: Docker Compose File Location = agents/docker-compose.yml,
# env (OPENAI_API_KEY, EXA_API_KEY) diisi lewat UI Coolify, bukan .env file
# (file .env ter-gitignore jadi tidak ikut ke artifact).
#
# Behind Caddy/Nginx/Traefik, remove `ports` and put the API on your proxy's
# network instead.
services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: minimal-agent-api:latest
    restart: unless-stopped
    # .env ter-gitignore → tidak ada di artifact Coolify. Buat file ini
    # optional biar deploy tidak error; di Coolify ambil dari UI env vars.
    env_file:
      - path: ./api/.env
        required: false
    environment:
      PORT: "3001"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
      BROWSER_HEADLESS: ${BROWSER_HEADLESS:-"true"}
    ports:
      - "127.0.0.1:3001:3001"
    # Chromium needs more shared memory than Docker's 64MB default.
    shm_size: "1gb"
    security_opt:
      - seccomp=unconfined
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
